name: Corebrain CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Run plugin tests
        run: node test.js

      - name: Run Node regression and bridge tests
        run: node --test tests/plugin-regressions.test.cjs tests/bridge-http.cjs tests/bridge-onload.cjs

      - name: Run extension tests
        run: npm test --prefix extension

      - name: Run release packager tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build Chrome extension
        run: npm run build:chrome --prefix extension

      - name: Build Firefox development extension
        run: npm run build:firefox --prefix extension

      - name: Package release artifacts
        run: python3 scripts/package-release.py --include-firefox

      - name: Verify release checksums
        run: cd release && sha256sum -c SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corebrain-release
          path: release/
          if-no-files-found: error
